# DB Connection
spring.jpa.database=postgresql
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/civify}
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:speedy}
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.root=INFO

# Backend URL Configuration (used for email verification links, etc.)
app.backend.base-url=${BACKEND_URL:http://localhost:8077}

# Caching Configuration
# Use Redis for caching in production, simple for development
# spring.cache.type=${CACHE_TYPE:simple}
# spring.redis.host=${REDIS_HOST:localhost}
# spring.redis.port=${REDIS_PORT:6379}
# spring.redis.password=${REDIS_PASSWORD:}
# spring.cache.redis.time-to-live=3600000
# spring.cache.redis.cache-null-values=false

# Email Verification Toggle - Enabled for production
email.verification.enabled=${EMAIL_VERIFICATION_ENABLED:true}

# Token
refresh.token.secure=${REFRESH_TOKEN_SECURE:true}