# Spring Cloud Compatibility
spring.cloud.compatibility-verifier.enabled=false

# DB Connection
spring.jpa.database=postgresql
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/civify}
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:speedy}
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.root=INFO

# create table auto for entities
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

# Enable Flyway in Dev
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.validate-on-migrate=false
spring.flyway.repair-on-migrate=true
#spring.jpa.defer-datasource-initialization=true
spring.flyway.baseline-on-migrate=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.database=0
# spring.data.redis.password=${REDIS_PASSWORD:}

# Redis Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.key-prefix=civify:
spring.cache.redis.use-key-prefix=true
spring.cache.redis.cache-null-values=false

## Documentaion
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/civify-docs-api
springdoc.swagger-ui.path=/civify-docs-ui
springdoc.packages-to-scan=com.app.civify.controller
springdoc.swagger-ui.tryItOutEnabled=true
# springdoc.swagger-ui.operationsSorter=method
# springdoc.swagger-ui.tagsSorter=alpha
# springdoc.swagger-ui.filter=true


# Payment Gatways Config

## Paymob Configuration
payment.paymob.api-key=${PAYMOB_API_KEY:dummy_paymob_key}
payment.paymob.iframe-id=${PAYMOB_IFRAME_ID:dummy_iframe_id}
payment.paymob.base-url=https://accept.paymob.com
payment.paymob.hmac-secret=${PAYMOB_HMAC_SECRET:dummy_hmac_secret}
payment.paymob.integration-id.card=${PAYMOB_CARD_INTEGRATION_ID:0}
payment.paymob.integration-id.wallet=${PAYMOB_WALLET_INTEGRATION_ID:0}
payment.paymob.apple-pay-integration-id=
payment.paymob.google-pay-integration-id=

## Fawaterak Payment Gateway Configuration
payment.fawaterak.base-url=${FAWATERAK_PROVIDER_URL:https://staging.fawaterk.com/api/v2}
payment.fawaterak.api-key=${FAWATERAK_API_KEY}
payment.fawaterak.provider-key=${FAWATERAK_PROVIDER_KEY}
payment.currency.fawaterk=EGP,USD

# Backend URL Configuration (used for email verification links, etc.)
app.backend.base-url=${BACKEND_URL:http://localhost:8077}

# Frontend URL Configuration
app.frontend.base-url=${FRONTEND_URL:http://localhost:3000}

# Payment Redirect URLs
payment.redirect.success-url=${app.frontend.base-url}/en/payment/success
payment.redirect.fail-url=${app.frontend.base-url}/en/payment/failure
payment.redirect.pending-url=${app.frontend.base-url}/en/payment/pending


# AI Service
ai.default.provider=${AI_D_Provider:vertex}
ai.default.model=${AI_D_Model:gemini-3-flash-preview}
ai.fallback.provider=${AI_F_Provider:gemini}
ai.fallback.model=${AI_F_Model:gemini-2.5-flash}

# SSO Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# LinkedIn OAuth2 Configuration
spring.security.oauth2.client.registration.linkedin.client-id=${LINKEDIN_CLIENT_ID}
spring.security.oauth2.client.registration.linkedin.client-secret=${LINKEDIN_CLIENT_SECRET}
spring.security.oauth2.client.registration.linkedin.scope=profile,email
spring.security.oauth2.client.registration.linkedin.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.linkedin.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.linkedin.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.linkedin.client-name=LinkedIn
spring.security.oauth2.client.provider.linkedin.user-info-uri=https://api.linkedin.com/v2/userinfo
spring.security.oauth2.client.provider.linkedin.user-name-attribute=sub


gemini.api.key=${GEMINI_API_KEY:gai}
spring.jpa.open-in-view=false

# Email Verification Toggle
email.verification.enabled=${EMAIL_VERIFICATION_ENABLED:false}

# Token
refresh.token.secure=${REFRESH_TOKEN_SECURE:true}
access.token.time=15

# Google Cloud Pub/Sub Configuration
gcp.project-id=${GCP_PROJECT_ID:civify-007}
gcp.pubsub.topic-name=projects/civify-007/topics/civify-notifications
gcp.pubsub.subscription-name=projects/civify-007/subscriptions/civify-notifications-sub

civify.security.block-disposable-emails=true

# Cloudflare R2 / S3 Storage
civify.r2.enabled=${R2_ENABLED:true}
civify.r2.access-key=${R2_ACCESS_KEY}
civify.r2.secret-key=${R2_SECRET_KEY}
civify.r2.bucket=${R2_BUCKET:civify}
civify.r2.endpoint=${R2_ENDPOINT:https://d9a9c23100b0249af5b1a3883c1fea0b.r2.cloudflarestorage.com/civify}