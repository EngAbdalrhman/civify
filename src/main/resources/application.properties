spring.application.name=civify
app.name=Civify
app.version=1.0.0
app.description=civify Backend
app.author=Abdalrhman Mostafa
app.author.email=amabdo30@gmail.com
app.author.website=https://github.com/engAbdalrhman
app.license=MIT
app.license.url=https://opensource.org/licenses/MIT
app.license.text=MIT License
app.logo=https://egypt-tech.static.domains/318317bf909630d4f634a53a96518810.png

spring.profiles.active=${ACTIVE_PROFILE:@spring.profiles.active@}

# Server Configuration
server.port=8077
server.address=${S_ADD:0.0.0.0}
server.servlet.context-path=/apis
server.error.include-message=always
server.forward-headers-strategy=native

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

logging.level.org.springframework.web=INFO
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
# logging.level.org.hibernate=INFO
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Jackson JSON Configuration - Reduce payload size
# spring.jackson.default-property-inclusion=non_empty

# create table auto for entities
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create
#hibernate.hbm2ddl.auto=create
# server.connection-timeout=30s

# Payment Gateway Configuration
# -----------------------------
# Enable/Disable specific gateways
payment.gateway.fawaterak.enabled=${FAWATERK_ENABLED:true}
payment.gateway.paymob.enabled=${PAYMOB_ENABLED:true}

# Paymob V2 API Configuration
# Secret Key (replaces API Key for V2)
payment.paymob.secret-key=${PAYMOB_SECRET_KEY:}
# Public Key (for frontend if needed)
payment.paymob.public-key=${PAYMOB_PUBLIC_KEY:}
# Toggle V2 vs Legacy (for gradual rollout)
payment.paymob.use-v2=${PAYMOB_USE_V2:false}

# Default Gateway (fawaterak or paymob)
payment.gateway.default=${PAYMENT_DEFAULT_GATEWAY:fawaterak}

# Flyway Database Migration Configuration
# Set FLYWAY_ENABLED=true in Dokploy env after first startup (when tables exist)
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# JWT Configuration
# SECURITY WARNING: NEVER use the default secret in production!
# Generate a secure secret: openssl rand -base64 64
# Minimum 64 characters (512 bits) required for HMAC-SHA512
jwt.secret=${JWT_SECRET:CHANGE_THIS_IN_PRODUCTION_USE_ENVIRONMENT_VARIABLE_MINIMUM_64_CHARACTERS_REQUIRED_FOR_SECURITY}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
# 15 minutes (900000 ms)
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:2592000000}
# 30 days (2592000000 ms)
jwt.issuer=${JWT_ISSUER:civify-api}
jwt.audience=${JWT_AUDIENCE:civify-client}
jwt.route.authentication=/apis/auth

# Permissions Encryption (AES-256)
# SECURITY WARNING: Change this 32-byte key in production!
# Generate secure key: openssl rand -base64 32
permissions.encryption.key=${PERMISSIONS_KEY:v3ry_s3cur3_k3y_f0r_c1v1fy_app!!}

gemini.base.url=https://generativelanguage.googleapis.com

# AI Service Configuration
ai.default.provider=${AI_D_Provider:vertex}
ai.default.model=${AI_D_Model:gemini-3-flash-preview}
ai.fallback.provider=${AI_F_Provider:gemini}
ai.fallback.model=${AI_F_Model:gemini-2.5-flash}
ai.gemini.vision.model=${AI_D_Model:gemini-3-flash-preview}

# AI Model Generation Limits
ai.model.maxOutputTokens=${AI_MAX_OUTPUT_TOKENS:8192}
ai.model.thinkingBudget=${AI_THINKING_BUDGET:1024}

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/civify-docs-api
springdoc.swagger-ui.path=/civify-docs-ui

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:gci}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:gcs}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# LinkedIn OAuth2 Configuration
spring.security.oauth2.client.registration.linkedin.client-id=${LINKEDIN_CLIENT_ID}
spring.security.oauth2.client.registration.linkedin.client-secret=${LINKEDIN_CLIENT_SECRET}
spring.security.oauth2.client.registration.linkedin.scope=openid,profile,email
spring.security.oauth2.client.registration.linkedin.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.linkedin.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.linkedin.client-name=LinkedIn
spring.security.oauth2.client.provider.linkedin.issuer-uri=https://www.linkedin.com/oauth


# Email Notification
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.properties.mail.smtp.ssl.trust=${SMTP_HOST:smtp.gmail.com}
# spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.protocol=smtp
default.email=${DEFAULT_EMAIL:}
cv.parsing.max-chars=160000

# Subscription Job Configuration
subscription.job.cron=0 1 0 * * ?

# Vertex AI Configuration
vertex.api.key=${VERTEX_API_KEY:}
vertex.api.url=${VERTEX_API_URL:https://aiplatform.googleapis.com}

# Google Cloud Pub/Sub Configuration
gcp.project-id=${GCP_PROJECT_ID:civify-007}
gcp.pubsub.topic-name=projects/civify-007/topics/civify-notifications
gcp.pubsub.subscription-name=projects/civify-007/subscriptions/civify-notifications-sub

# Notification Publisher (pubsub | postgres)
notification.publisher=${NOTIFICATION_PUBLISHER:pubsub}

# Cloudflare R2 / S3 Storage
civify.r2.enabled=${R2_ENABLED:true}
civify.r2.access-key=${R2_ACCESS_KEY}
civify.r2.secret-key=${R2_SECRET_KEY}
civify.r2.bucket=${R2_BUCKET:civify}
civify.r2.endpoint=${R2_ENDPOINT}

# Cache Configuration
cache.redis.enabled=${REDIS_ENABLED:true}

# Native Spring Boot toggles to disable auto-configurations
# Disable Redis repositories if cache is disabled
spring.data.redis.repositories.enabled=${REDIS_ENABLED:false}

# Disable GCP Pub/Sub Auto-Configuration
spring.cloud.gcp.pubsub.enabled=${GCP_PUBSUB_ENABLED:false}

