# DB Connection
spring.jpa.database=postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/civify
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:speedy}
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# logging.level.root=DEBUG


# Email Notification
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${REMAIL}
spring.mail.password=${REPASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
# spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.connectiontimeout=5000

## Documentaion
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/civify-docs-api
springdoc.swagger-ui.path=/civify-docs-ui
springdoc.packages-to-scan=com.app.civify.controller
springdoc.swagger-ui.tryItOutEnabled=true
# springdoc.swagger-ui.operationsSorter=method
# springdoc.swagger-ui.tagsSorter=alpha
# springdoc.swagger-ui.filter=true


# Firebase Configuration
app.firebase.api-url=https://fcm.googleapis.com/fcm/send
app.firebase.server-key=${FIREBASE_SERVER_KEY:

# Paymob Configuration
PAYMOB_API_KEY=PaymobApiKey123
PAYMOB_INTEGRATION_ID=123456
PAYMOB_IFRAME_ID=987654
PAYMOB_HMAC_SECRET=PaymobHmacSecret789}


# SSO Configuration
sso.google.client-id=${GOOGLE_CLIENT_ID:GoogleClientId123}
sso.google.client-secret=${GOOGLE_CLIENT_SECRET:GoogleClientSecret123}
sso.redirect-uri=${SSO_REDIRECT_URI:http://localhost:8080/apis/auth/oauth2/callback}

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
