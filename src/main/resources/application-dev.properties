spring.application.name=civify-staging

# Spring Cloud Compatibility
spring.cloud.compatibility-verifier.enabled=false

# DB Connection
spring.jpa.database=postgresql
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/civify}
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:speedy}
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# logging.level.root=DEBUG
# create table auto for entities
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

# Enable Flyway in Dev
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.validate-on-migrate=false
spring.flyway.repair-on-migrate=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.database=0
# spring.data.redis.password=${REDIS_PASSWORD:}

# Redis Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.key-prefix=civify:
spring.cache.redis.use-key-prefix=true
spring.cache.redis.cache-null-values=false

## Documentaion
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/civify-docs-api
springdoc.swagger-ui.path=/civify-docs-ui
springdoc.packages-to-scan=com.app.civify.controller
springdoc.swagger-ui.tryItOutEnabled=true
# springdoc.swagger-ui.operationsSorter=method
# springdoc.swagger-ui.tagsSorter=alpha
# springdoc.swagger-ui.filter=true


# Payment Gatways Config

## Paymob Configuration
payment.paymob.api-key=${PAYMOB_API_KEY:dummy_paymob_key}
payment.paymob.integration-id=${PAYMOB_INTEGRATION_ID:dummy_integration_id}
payment.paymob.iframe-id=${PAYMOB_IFRAME_ID:dummy_iframe_id}
payment.paymob.base-url=https://accept.paymob.com
payment.paymob.hmac-secret=${PAYMOB_HMAC_SECRET:dummy_hmac_secret}

## Fawaterak Payment Gateway Configuration
payment.fawaterak.base-url=${FAWATERAK_PROVIDER_URL:https://staging.fawaterk.com/api/v2}
payment.fawaterak.api-key=${FAWATERAK_API_KEY:b0159ad9f13221271e2dd8388f91e5f2fa27d73797574c6899}
payment.fawaterak.provider-key=${FAWATERAK_PROVIDER_KEY:FAWATERAK.2138}
payment.currency.fawaterk=EGP,USD

# Backend URL Configuration (used for email verification links, etc.)
app.backend.base-url=${BACKEND_URL:http://localhost:8077}

# Frontend URL Configuration
app.frontend.base-url=${FRONTEND_URL:http://localhost:3000}

# Payment Redirect URLs
payment.redirect.success-url=${app.frontend.base-url}/en/payment/success
payment.redirect.fail-url=${app.frontend.base-url}/en/payment/failure
payment.redirect.pending-url=${app.frontend.base-url}/en/payment/pending


# AI Service
ai.default.provider=${AI_D_Provider:gemini}
ai.default.model=${AI_D_Model:gemini-3-flash-preview}
ai.fallback.provider=${AI_F_Provider:gemini}
ai.fallback.model=${AI_F_Model:gemini-2.5-flash}

# SSO Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

gemini.api.key=${GEMINI_API_KEY:gai}
spring.jpa.open-in-view=false

# Email Verification Toggle - Disabled for development
email.verification.enabled=${EMAIL_VERIFICATION_ENABLED:true}

# Token
refresh.token.secure=${REFRESH_TOKEN_SECURE:false}

# Google Cloud Pub/Sub Configuration
gcp.project-id=${GCP_PROJECT_ID:civify-007}
gcp.pubsub.topic-name=projects/civify-007/topics/civify-notifications
gcp.pubsub.subscription-name=projects/civify-007/subscriptions/civify-notifications-sub
