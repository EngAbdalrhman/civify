# DB Connection
spring.jpa.database=postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/civify
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:speedy}
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# logging.level.root=DEBUG

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.database=0
# spring.data.redis.password=${REDIS_PASSWORD:}

# Redis Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.key-prefix=civify:
spring.cache.redis.use-key-prefix=true
spring.cache.redis.cache-null-values=false


# Email Notification
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${REMAIL}
spring.mail.password=${REPASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
# spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.connectiontimeout=5000

## Documentaion
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/civify-docs-api
springdoc.swagger-ui.path=/civify-docs-ui
springdoc.packages-to-scan=com.app.civify.controller
springdoc.swagger-ui.tryItOutEnabled=true
# springdoc.swagger-ui.operationsSorter=method
# springdoc.swagger-ui.tagsSorter=alpha
# springdoc.swagger-ui.filter=true


# Payment Gatways Config

## Paymob Configuration
payment.paymob.api-key=${PAYMOB_API_KEY:dummy_paymob_key}
payment.paymob.integration-id=${PAYMOB_INTEGRATION_ID:dummy_integration_id}
payment.paymob.iframe-id=${PAYMOB_IFRAME_ID:dummy_iframe_id}
payment.paymob.base-url=https://accept.paymob.com
payment.paymob.hmac-secret=${PAYMOB_HMAC_SECRET:dummy_hmac_secret}

## Fawaterak Payment Gateway Configuration
payment.fawaterak.base-url=${FAWATERAK_PROVIDER_URL:https://staging.fawaterk.com/api/v2}
payment.fawaterak.api-key=${FAWATERAK_API_KEY:b0159ad9f13221271e2dd8388f91e5f2fa27d73797574c6899}
payment.fawaterak.provider-key=${FAWATERAK_PROVIDER_KEY:FAWATERAK.2138}

# Frontend URL Configuration
app.frontend.base-url=${FRONTEND_URL:http://localhost:9002}

# Payment Redirect URLs
payment.redirect.success-url=${app.frontend.base-url}/dashboard/payment/success
payment.redirect.fail-url=${app.frontend.base-url}/dashboard/payment/failure
payment.redirect.pending-url=${app.frontend.base-url}/dashboard/payment/pending


# AI Service
ai.default.provider=gemini
ai.default.model=gemini-pro
ai.fallback.provider=gemini-flash

# SSO Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

gemini.api.key=${GEMINI_API_KEY:gai}
spring.jpa.open-in-view=false
