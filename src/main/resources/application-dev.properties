# DB Connection
spring.jpa.database=postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/civify
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:speedy}
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# logging.level.root=DEBUG

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.database=0
# spring.data.redis.password=${REDIS_PASSWORD:}

# Redis Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.key-prefix=civify:
spring.cache.redis.use-key-prefix=true
spring.cache.redis.cache-null-values=false


# Email Notification
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${REMAIL}
spring.mail.password=${REPASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
# spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.connectiontimeout=5000

## Documentaion
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/civify-docs-api
springdoc.swagger-ui.path=/civify-docs-ui
springdoc.packages-to-scan=com.app.civify.controller
springdoc.swagger-ui.tryItOutEnabled=true
# springdoc.swagger-ui.operationsSorter=method
# springdoc.swagger-ui.tagsSorter=alpha
# springdoc.swagger-ui.filter=true


# Firebase Configuration
app.firebase.api-url=https://fcm.googleapis.com/fcm/send
app.firebase.server-key=${FIREBASE_SERVER_KEY:

