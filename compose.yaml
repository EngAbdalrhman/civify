version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: civify_dev
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
    ports:
      - 5432:5432
  redis:
    image: redis:7
    ports:
      - 6379:6379
  app:
    build: .
    ports:
      - 8080:8080
    depends_on:
      - db
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/civify_dev
      SPRING_DATASOURCE_USERNAME: devuser
      SPRING_DATASOURCE_PASSWORD: devpass
